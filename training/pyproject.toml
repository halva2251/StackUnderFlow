[project]
name = "training"
version = "0.1.0"
description = "Training data pipeline for StackUnderFlow AI model"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.32",
    "types-tqdm>=4.67",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_training_data.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
