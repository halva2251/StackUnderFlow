name: stackunderflow

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackunderflow-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: stackunderflow-nginx
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:80:80'
    restart: unless-stopped

  postgres:
    image: postgres:18.3-alpine
    container_name: stackunderflow-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stackunderflow
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
