events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Redirect HTTP to HTTPS (except health check)
    server {
        listen 80;
        server_name _;

        # Health check endpoint — allowed over HTTP for Docker health checks.
        # All other paths redirect to HTTPS.
        location /health {
            proxy_pass http://api;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    upstream api {
        server api:8080;
    }

    # HTTPS server — terminates TLS.
    # NOTE: This uses a self-signed certificate for local development.
    # For production, replace /etc/nginx/tls/server.crt and server.key
    # with certificates from a trusted CA (e.g. Let's Encrypt).
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (X-Frame-Options set to DENY by Go middleware; omitted here)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location /health {
            proxy_pass http://api;
            access_log off;
        }
    }
}
